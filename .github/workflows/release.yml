name: Release

# Push a tag like v1.2.3. This creates the GitHub release from CHANGELOG.md
# and moves the major tag (v1) so `uses: curl-sms/send-sms@v1` gets the update.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
      - name: Move major tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          major="${VERSION%%.*}"
          git tag -f "$major" "$VERSION"
          git push -f origin "refs/tags/$major"
